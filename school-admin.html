<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b1a17">
  <title>Powered by BRASA — School administration</title>
  <style>
    :root{--ink:#1b1a17;--paper:#fbf9f4;--red:#8c3a1f;--line:#ddd5c7;--green:#0d6e5c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:clamp(24px,6vw,64px)}h1{font:400 clamp(2.4rem,7vw,4.8rem)/1.02 Georgia,serif;margin:.3em 0}.eyebrow{color:var(--red);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase}.card,.lesson{background:#fff;border:1px solid var(--line);padding:24px;margin:22px 0}.lesson{padding:16px}label{display:block;font-weight:650;margin-top:14px}input,textarea,select,button{width:100%;padding:12px;margin-top:6px;font:inherit;border:1px solid #aaa;background:#fff}textarea{min-height:120px}button{background:var(--ink);color:#fff;border-color:var(--ink);cursor:pointer;margin-top:18px}.secondary{background:#fff;color:var(--ink)}button:disabled{opacity:.55}.status{min-height:1.5em;color:var(--green)}[hidden]{display:none!important}:focus-visible{outline:3px solid var(--red);outline-offset:2px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body><main class="wrap"><p class="eyebrow">Powered by BRASA · Protected by BRASA</p><h1>Your school.</h1><p>Private administration for authorized school teams. Invitation codes are single-use; sessions stay only in this browser tab.</p>
  <section class="card" id="signin"><h2>Sign in with an invitation</h2><form id="signinForm"><label for="invitation">Invitation code</label><input id="invitation" name="invitation" autocomplete="one-time-code" required minlength="32"><button>Continue</button></form></section>
  <section class="card" id="workspace" hidden><h2>School workspace</h2><p id="identity"></p><label for="schoolId">School ID</label><input id="schoolId" required pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,79}"><button id="load" type="button">Open school</button><div id="tools" hidden><h3>Create a lesson draft</h3><form id="lessonForm"><label for="slug">Lesson slug</label><input id="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*"><label for="title">Title</label><input id="title" required maxlength="240"><label for="summary">Summary</label><textarea id="summary" maxlength="500"></textarea><button>Create private draft</button></form><h3>Invite a team member</h3><form id="inviteForm"><label for="inviteActorId">BRASA ID</label><input id="inviteActorId" required pattern="BRA-[A-Za-z0-9-]{5,40}"><label for="inviteRole">Role</label><select id="inviteRole"><option value="teacher">Teacher</option><option value="curriculum_reviewer">Curriculum reviewer</option><option value="student">Student</option><option value="guardian">Guardian</option></select><button>Create one-time invitation</button></form><output id="invitationOutput" class="status"></output><h3>Team access</h3><form id="memberForm"><label for="actorId">BRASA ID</label><input id="actorId" required pattern="BRA-[A-Za-z0-9-]{5,40}"><label for="role">Role</label><select id="role"><option value="teacher">Teacher</option><option value="curriculum_reviewer">Curriculum reviewer</option><option value="student">Student</option><option value="guardian">Guardian</option></select><label for="memberStatus">Access</label><select id="memberStatus"><option value="active">Active</option><option value="suspended">Suspended</option><option value="revoked">Revoked</option></select><button>Save team member</button></form><h3>Lesson review</h3><div id="lessons"></div></div><button class="secondary" id="logout" type="button">Sign out</button></section><p class="status" id="status" role="status" aria-live="polite"></p>
</main><script type="module">
const state={token:null,expiresAt:0,displayId:null};const signin=document.querySelector('#signin'),workspace=document.querySelector('#workspace'),status=document.querySelector('#status'),identity=document.querySelector('#identity');
const school=()=>document.querySelector('#schoolId').value.trim();
async function api(path,options={}){const response=await fetch(path,{...options,headers:{accept:'application/json',...(state.token?{authorization:`Bearer ${state.token}`}:{}) ,...(options.body?{'content-type':'application/json'}:{})}});const data=await response.json();if(!response.ok)throw new Error(data.error||'request_failed');return data}
function clear(){state.token=null;state.expiresAt=0;state.displayId=null;signin.hidden=false;workspace.hidden=true;document.querySelector('#tools').hidden=true;identity.textContent=''}
async function renew(){if(!state.token||Date.now()<state.expiresAt-120000)return;const data=await api('/api/v1/session/renew',{method:'POST'});state.token=data.access_token;state.expiresAt=Date.parse(data.expires_at)}
document.querySelector('#signinForm').addEventListener('submit',async event=>{event.preventDefault();status.textContent='Signing in…';try{const data=await api('/api/v1/session/exchange',{method:'POST',body:JSON.stringify({invitation_code:event.currentTarget.invitation.value.trim()})});state.token=data.access_token;state.expiresAt=Date.parse(data.expires_at);state.displayId=data.display_id;identity.textContent=`Signed in as ${data.display_id}`;signin.hidden=true;workspace.hidden=false;event.currentTarget.reset();status.textContent='Ready.'}catch{status.textContent='That invitation is invalid or expired.'}});
async function loadSchool(){status.textContent='Opening school…';try{await renew();const result=await api(`/api/v1/schools/${encodeURIComponent(school())}/manage`),list=document.querySelector('#lessons');list.replaceChildren();for(const lesson of result.data.lessons){const card=document.createElement('article'),heading=document.createElement('h4'),meta=document.createElement('p'),select=document.createElement('select'),button=document.createElement('button');card.className='lesson';heading.textContent=lesson.title;meta.textContent=`${lesson.locale} · ${lesson.status}`;for(const value of ['review','published','archived']){const option=document.createElement('option');option.value=value;option.textContent=value[0].toUpperCase()+value.slice(1);select.append(option)}select.value=lesson.status==='draft'?'review':lesson.status;button.textContent='Update lesson status';button.addEventListener('click',async()=>{try{await renew();await api(`/api/v1/schools/${encodeURIComponent(school())}/lessons/${lesson.id}/status`,{method:'POST',body:JSON.stringify({status:select.value})});await loadSchool()}catch{status.textContent='The lesson status could not be updated.'}});card.append(heading,meta,select,button);list.append(card)}document.querySelector('#tools').hidden=false;status.textContent=`School opened. ${result.data.memberships.length} team memberships.`}catch{document.querySelector('#tools').hidden=true;status.textContent='You do not have administrator access to that school.'}}
document.querySelector('#load').addEventListener('click',loadSchool);
document.querySelector('#lessonForm').addEventListener('submit',async event=>{event.preventDefault();status.textContent='Creating draft…';try{await renew();const payload={slug:event.currentTarget.slug.value.trim(),locale:'en',title:event.currentTarget.title.value.trim(),summary:event.currentTarget.summary.value.trim(),body:{blocks:[]},accessibility:{language:'en'},offlineEligible:true};await api(`/api/v1/schools/${encodeURIComponent(school())}/lessons`,{method:'POST',body:JSON.stringify(payload)});event.currentTarget.reset();await loadSchool()}catch{status.textContent='The draft could not be created.'}});
document.querySelector('#memberForm').addEventListener('submit',async event=>{event.preventDefault();status.textContent='Saving team access…';try{await renew();await api(`/api/v1/schools/${encodeURIComponent(school())}/memberships`,{method:'POST',body:JSON.stringify({actorId:event.currentTarget.actorId.value.trim(),role:event.currentTarget.role.value,status:event.currentTarget.memberStatus.value})});event.currentTarget.actorId.value='';await loadSchool()}catch{status.textContent='Team access could not be updated.'}});
document.querySelector('#inviteForm').addEventListener('submit',async event=>{event.preventDefault();status.textContent='Creating invitation…';const output=document.querySelector('#invitationOutput');output.textContent='';try{await renew();const result=await api(`/api/v1/schools/${encodeURIComponent(school())}/invitations`,{method:'POST',body:JSON.stringify({actorId:event.currentTarget.inviteActorId.value.trim(),role:event.currentTarget.inviteRole.value})});output.textContent=`Copy this code now; it is shown once: ${result.data.invitationCode}`;event.currentTarget.inviteActorId.value='';status.textContent=`Invitation expires ${new Date(result.data.expiresAt).toLocaleString()}.`}catch{status.textContent='The invitation could not be created.'}});
document.querySelector('#logout').addEventListener('click',async()=>{try{await api('/api/v1/session/logout',{method:'POST'})}finally{clear();status.textContent='Signed out.'}});clear();
  </script></body></html>
